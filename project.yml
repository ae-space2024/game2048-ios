name: Game2048
options:
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  bundleIdPrefix: com.trollstore
targets:
  Game2048:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.trollstore.game2048
        PRODUCT_NAME: Game2048
        INFOPLIST_FILE: SupportingFiles/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        ENABLE_PREVIEWS: NO
        GENERATE_INFOPLIST_FILE: NO
